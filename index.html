<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Strandh – UI / UX designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script>
    // Sätter sparat tema direkt, så sidan inte blinkar ljus innan den blir mörk
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="vanta-bg" aria-hidden="true"></div>

  <header class="site-header">
    <div class="site-header__left">
      <button class="theme-toggle glass" type="button" role="switch"
              aria-checked="false" aria-label="Dark mode">
        <span class="theme-toggle__knob"></span>
      </button>
      <div class="brand">
        <p class="brand__name">Simon Strandh</p>
        <p class="brand__role">UI / UX designer</p>
      </div>
    </div>
    <p class="status glass">
      <span class="status__dot" aria-hidden="true"></span>
      Available for work
    </p>
  </header>

  <main class="hero">
    <h1 class="hero__title">Design with passion.</h1>
    <nav class="nav glass" aria-label="Main">
      <span class="nav__item">Projects</span>
      <span class="nav__item">About me</span>
      <span class="nav__item">Contact</span>
    </nav>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"
          integrity="sha384-9EQoUIJYrv09/oYhSxnw1VpLcfPw3BM9dE7+D/3wGUPeLLa7F9Z6OAoD+i/M6FK9"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.clouds.min.js"
          integrity="sha384-1taX5yEk+ymUOq1idyE+buIpKOZz94Xz/nz4iRxF0OCv/ppmRhun994ocCLRtaUR"
          crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
</body>
</html>
